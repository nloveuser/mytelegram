name: Build Docker Images

# Builds the 6 open-source MyTelegram server images and publishes them to
# the GitHub Container Registry (ghcr.io/<owner>/mytelegram-*).
#
# The build context is the `source/` directory and the Dockerfiles live under
# `build/docker/`. Compiling here also acts as CI: a broken build fails the run.
#
# The `session-server` and `file-server` images referenced by docker-compose are
# closed-source (Pro) and are NOT built here; pull them from Docker Hub `mytelegram/`.

on:
  push:
    branches:
      - claude/repo-exploration-fzbv8e
    paths:
      - 'source/**'
      - 'build/docker/**'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - mytelegram-messenger-command-server
          - mytelegram-messenger-query-server
          - mytelegram-sms-sender
          - mytelegram-gateway-server
          - mytelegram-auth-server
          - mytelegram-data-seeder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(head -n 1 build/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./build/docker/Dockerfile-${{ matrix.service }}
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_CONFIGURATION=Release
            TARGETARCH=amd64
            BUILDPLATFORM=linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.service }}:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
